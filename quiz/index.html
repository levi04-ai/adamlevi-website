<style>
  html, body { height: 100%; }
  body {
    background: #E7CAA6;
    color: #2C292E;
    -webkit-tap-highlight-color: transparent;
  }

  /* צל קשיח — חלק מהשפה הוויזואלית של הסדרה */
  .shadow-hard    { box-shadow: 6px 6px 0 #2C292E; }
  .shadow-hard-sm { box-shadow: 3px 3px 0 #2C292E; }

  /* מעברים בין מסכים */
  .screen-enter { animation: screenIn .32s cubic-bezier(.2,.7,.3,1) both; }
  .screen-leave { animation: screenOut .18s ease-in both; }
  @keyframes screenIn  { from { opacity:0; transform: translateY(14px) scale(.985); }
                         to   { opacity:1; transform: none; } }
  @keyframes screenOut { from { opacity:1; transform: none; }
                         to   { opacity:0; transform: translateY(-10px) scale(.99); } }

  /* הופעה מדורגת של כפתורי התשובות */
  .stagger > * { animation: itemIn .3s ease-out both; }
  .stagger > *:nth-child(1) { animation-delay: .04s; }
  .stagger > *:nth-child(2) { animation-delay: .09s; }
  .stagger > *:nth-child(3) { animation-delay: .14s; }
  .stagger > *:nth-child(4) { animation-delay: .19s; }
  .stagger > *:nth-child(5) { animation-delay: .24s; }
  .stagger > *:nth-child(6) { animation-delay: .29s; }
  @keyframes itemIn { from { opacity:0; transform: translateX(10px); } to { opacity:1; transform:none; } }

  .answer-btn { transition: transform .12s ease, box-shadow .12s ease, background-color .12s ease; }
  .answer-btn:hover  { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 #2C292E; background:#fff; }
  .answer-btn:active { transform: translate(1px,1px);  box-shadow: 1px 1px 0 #2C292E; }
  .answer-btn.picked { background:#2C292E; color:#FFF8EE; transform: translate(1px,1px); box-shadow: 1px 1px 0 #2C292E; }

  .cta-btn { transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
  .cta-btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #2C292E; }
  .cta-btn:active { transform: translate(1px,1px);   box-shadow: 2px 2px 0 #2C292E; }

  /* פס התקדמות */
  .pip { transition: background-color .3s ease, transform .3s ease; }

  /* מעטפת התצוגה המוקטנת של כרטיס הסטורי */
  #story-frame { overflow: hidden; }
  #story-card  { transform-origin: top right; }

  @media (prefers-reduced-motion: reduce) {
    .screen-enter, .screen-leave, .stagger > * { animation: none !important; }
  }
</style>
